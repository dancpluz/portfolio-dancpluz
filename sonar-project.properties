# Project identification
sonar.projectKey=portfolio-dancpluz
sonar.projectName=portfolio-dancpluz
sonar.projectVersion=1.0.0

# Connection settings
sonar.host.url=http://localhost:9000

# Source configuration
sonar.sources=.
sonar.exclusions=**/node_modules/**, **/.next/**, **/.scannerwork/**, **/public/**, **/dist/**, **/build/**, **/*.config.js, **/*.config.mjs, pnpm-lock.yaml

# Encoding
sonar.sourceEncoding=UTF-8

# TypeScript TSConfig path
sonar.typescript.tsconfigPath=tsconfig.json
